kind = "web"
previewPath = "/"
title = "Pocketpill"
version = "1.0.0"
id = "artifacts/pocketpill"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23238

[services.development]
run = "pnpm --filter @workspace/pocketpill run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pocketpill", "run", "build" ]
publicDir = "artifacts/pocketpill/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23238"
BASE_PATH = "/"
